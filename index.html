<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>あいうべ体操 非ゲーム条件</title>

    <style>

                /* =========================================================
           基本
        ========================================================= */

                * {
                    box-sizing: border-box;
                }

                html,
                body {
                    margin: 0;
                    padding: 0;
                    width: 100%;
                    min-height: 100%;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
                    background: #f5f5f5;
                    color: #222;
                }


                /* =========================================================
           画面
        ========================================================= */

                .screen {
                    min-height: 100vh;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    padding: 24px;
                }

                .hidden {
                    display: none !important;
                }


                /* =========================================================
           パネル
        ========================================================= */

                .panel {
                    width: 100%;
                    max-width: 700px;
                    padding: 40px;
                    background: white;
                    border: 1px solid #ddd;
                    border-radius: 12px;
                    text-align: center;
                }

                    .panel h1 {
                        margin-top: 0;
                        font-size: 36px;
                    }

                    .panel h2 {
                        font-size: 28px;
                    }


                /* =========================================================
           説明
        ========================================================= */

                .instructionBox {
                    margin: 30px 0;
                    padding: 20px;
                    background: #f7f7f7;
                    border-radius: 8px;
                    text-align: left;
                }

                    .instructionBox p {
                        line-height: 1.8;
                    }


                /* =========================================================
           Session ID
        ========================================================= */

                .inputGroup {
                    margin: 30px 0;
                }

                    .inputGroup label {
                        display: block;
                        margin-bottom: 8px;
                        font-weight: bold;
                    }

                    .inputGroup input {
                        width: 100%;
                        max-width: 400px;
                        padding: 12px;
                        font-size: 20px;
                        border: 1px solid #aaa;
                        border-radius: 6px;
                    }


                /* =========================================================
           ボタン
        ========================================================= */

                button {
                    display: block;
                    width: 100%;
                    max-width: 400px;
                    margin: 16px auto;
                    padding: 14px 20px;
                    font-size: 20px;
                    border-radius: 8px;
                    cursor: pointer;
                }

                .primaryButton {
                    background: #222;
                    color: white;
                    border: none;
                }

                .secondaryButton {
                    background: white;
                    color: #222;
                    border: 1px solid #777;
                }

                button:disabled {
                    opacity: 0.4;
                    cursor: not-allowed;
                }


                /* =========================================================
           ステータス
        ========================================================= */

                .statusText {
                    margin: 20px 0;
                    font-size: 18px;
                    white-space: pre-line;
                }


                /* =========================================================
           カメラ
        ========================================================= */

                #cameraContainer {
                    position: fixed;
                    top: 20px;
                    left: 20px;
                    width: 220px;
                    z-index: 1000;
                    background: black;
                    border-radius: 8px;
                    overflow: hidden;
                }

                #webcam {
                    display: block;
                    width: 100%;
                    height: auto;
                    transform: scaleX(-1);
                }


                /* =========================================================
           キャリブレーション
        ========================================================= */

                .largeMouth {
                    margin: 30px 0;
                    font-size: 140px;
                    font-weight: bold;
                }

                .largeInstruction {
                    font-size: 26px;
                }

                .progressText {
                    margin-top: 30px;
                    font-size: 22px;
                }

                .progressBarOuter {
                    width: 100%;
                    height: 24px;
                    margin-top: 20px;
                    background: #ddd;
                    border-radius: 12px;
                    overflow: hidden;
                }

                .progressBarInner {
                    width: 0%;
                    height: 100%;
                    background: #444;
                }


                /* =========================================================
           カウントダウン
        ========================================================= */

                .countdownText {
                    font-size: 180px;
                    font-weight: bold;
                }


                /* =========================================================
           実験
        ========================================================= */

                .experimentPanel {
                    width: 100%;
                    text-align: center;
                }

                .setDisplay {
                    font-size: 28px;
                }

                .experimentMouth {
                    margin: 30px 0;
                    font-size: 200px;
                    font-weight: bold;
                }

                .experimentInstruction {
                    font-size: 24px;
                }


                /* =========================================================
           スマートフォン
        ========================================================= */

                @media (max-width: 600px) {

                    .panel {
                        padding: 24px 18px;
                    }

                    .largeMouth {
                        font-size: 110px;
                    }

                    .experimentMouth {
                        font-size: 160px;
                    }

                    .countdownText {
                        font-size: 140px;
                    }

                    #cameraContainer {
                        width: 140px;
                        top: 10px;
                        left: 10px;
                    }
                }
    </style>
</head>

<body>


    <!-- =========================================================
         カメラ
    ========================================================= -->

    <div id="cameraContainer">

        <video id="webcam"
               autoplay
               playsinline
               muted></video>

    </div>


    <!-- =========================================================
         初期画面
    ========================================================= -->

    <main id="setupScreen"
          class="screen">

        <div class="panel">

            <h1>
                あいうべ体操
            </h1>

            <h2>
                実験準備
            </h2>


            <div class="instructionBox">

                <p>
                    画面に表示される
                    「あ」「い」「う」「べ」に合わせて
                    口を動かしてください。
                </p>

                <p>
                    最初に口の動きを確認します。
                </p>

                <p>
                    その後、実験を開始します。
                </p>

            </div>


            <div class="inputGroup">

                <label for="sessionIdInput">
                    Session ID
                </label>

                <input type="text"
                       id="sessionIdInput"
                       placeholder="例：P001"
                       autocomplete="off">

            </div>


            <button id="prepareCameraButton"
                    class="primaryButton">
                カメラを準備
            </button>


            <p id="cameraStatus"
               class="statusText">
                カメラはまだ準備されていません。
            </p>


            <button id="startCalibrationButton"
                    class="primaryButton"
                    disabled>
                口の動きを確認する
            </button>

        </div>

    </main>


    <!-- =========================================================
         キャリブレーション
    ========================================================= -->

    <main id="calibrationScreen"
          class="screen hidden">

        <div class="panel">

            <h2>
                口の動きを確認します
            </h2>


            <div id="calibrationMouth"
                 class="largeMouth">
                あ
            </div>


            <p id="calibrationInstruction"
               class="largeInstruction">
                口を大きく開けてください
            </p>


            <p id="calibrationStatus"
               class="statusText">
                準備...
            </p>


            <p id="calibrationProgressText"
               class="progressText">
                1 / 4
            </p>


            <div class="progressBarOuter">

                <div id="calibrationProgressBar"
                     class="progressBarInner"></div>

            </div>

        </div>

    </main>


    <!-- =========================================================
         準備完了
    ========================================================= -->

    <main id="readyScreen"
          class="screen hidden">

        <div class="panel">

            <h1>
                準備完了
            </h1>

            <p>
                口の動きの確認が完了しました。
            </p>

            <p>
                実験開始ボタンを押してください。
            </p>


            <button id="startExperimentButton"
                    class="primaryButton">
                実験開始
            </button>

        </div>

    </main>


    <!-- =========================================================
         カウントダウン
    ========================================================= -->

    <main id="countdownScreen"
          class="screen hidden">

        <div id="countdownText"
             class="countdownText">
            3
        </div>

    </main>


    <!-- =========================================================
         実験
    ========================================================= -->

    <main id="experimentScreen"
          class="screen hidden">

        <div class="experimentPanel">

            <p id="setDisplay"
               class="setDisplay">
                1 / 10
            </p>


            <div id="mouthDisplay"
                 class="experimentMouth">
                あ
            </div>


            <p class="experimentInstruction">
                表示された口の形をしてください
            </p>

        </div>

    </main>


    <!-- =========================================================
         終了
    ========================================================= -->

    <main id="finishScreen"
          class="screen hidden">

        <div class="panel">

            <h1>
                実験終了
            </h1>


            <p>
                ご協力ありがとうございました。
            </p>


            <button id="sendDataButton"
                    class="primaryButton">
                データを送信
            </button>


            <button id="backupButton"
                    class="secondaryButton">
                バックアップを保存
            </button>


            <p id="sendStatus"
               class="statusText"></p>

        </div>

    </main>


    <!-- =========================================================
         JavaScript
    ========================================================= -->

    <script type="module">

        /* ===========================================================
        MediaPipe

        以前の
        vision_bundle.mjs
        を直接指定する方法は使用しない。

        jsDelivrのES Module変換を使用する。
        =========================================================== */

        import {
        FaceLandmarker,
        FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";


        /* ===========================================================
        設定
        =========================================================== */


        /* -----------------------------------------------------------
        Google Apps Script

        GASをWebアプリとしてデプロイ後、
        /exec で終わるURLを設定する。
        ----------------------------------------------------------- */

        const GAS_URL =
        "ここにGASのWebアプリURL";


        /* -----------------------------------------------------------
        カメラプレビュー

        false:
        参加者には映像を表示しない。

        MediaPipeのカメラ処理は動作する。
        ----------------------------------------------------------- */

        const SHOW_CAMERA_PREVIEW =
        false;


        /* -----------------------------------------------------------
        キャリブレーション

        Unity版と同じ

        準備       0.5秒
        測定       1.5秒
        ----------------------------------------------------------- */

        const CALIBRATION_PREPARE_TIME_MS =
        500;

        const CALIBRATION_MEASUREMENT_TIME_MS =
        1500;


        /* -----------------------------------------------------------
        Neutral

        Unity版:
        mouthDeadZone = 0.12
        ----------------------------------------------------------- */

        const MOUTH_DEAD_ZONE =
        0.12;


        /* -----------------------------------------------------------
        BE確定時間

        Unity版:
        beHoldTime = 0.15秒
        ----------------------------------------------------------- */

        const BE_HOLD_TIME_MS =
        150;


        /* -----------------------------------------------------------
        実験
        ----------------------------------------------------------- */

        const TOTAL_SETS =
        10;

        const MOUTHS_PER_SET =
        4;

        const TOTAL_TRIALS =
        TOTAL_SETS *
        MOUTHS_PER_SET;


        /* 1口形 = 1秒 */

        const MOUTH_DURATION_MS =
        1000;


        /* MouthLog = 約0.1秒 */

        const LOG_INTERVAL_MS =
        100;


        /* -----------------------------------------------------------
        口形順
        ----------------------------------------------------------- */

        const MOUTH_SEQUENCE = [
        "A",
        "I",
        "U",
        "BE"
        ];


        /* -----------------------------------------------------------
        表示文字
        ----------------------------------------------------------- */

        const MOUTH_DISPLAY = {

        A: "あ",

        I: "い",

        U: "う",

        BE: "べ"
        };


        /* -----------------------------------------------------------
        キャリブレーション説明
        ----------------------------------------------------------- */

        const CALIBRATION_INSTRUCTIONS = {

        A:
        "口を大きく開けてください",

        I:
        "口を横に広げてください",

        U:
        "口を前にすぼめてください",

        BE:
        "口を開けて舌を出してください"
        };


        /* ===========================================================
        DOM
        =========================================================== */

        const setupScreen =
        document.getElementById(
        "setupScreen"
        );

        const calibrationScreen =
        document.getElementById(
        "calibrationScreen"
        );

        const readyScreen =
        document.getElementById(
        "readyScreen"
        );

        const countdownScreen =
        document.getElementById(
        "countdownScreen"
        );

        const experimentScreen =
        document.getElementById(
        "experimentScreen"
        );

        const finishScreen =
        document.getElementById(
        "finishScreen"
        );


        const sessionIdInput =
        document.getElementById(
        "sessionIdInput"
        );

        const prepareCameraButton =
        document.getElementById(
        "prepareCameraButton"
        );

        const startCalibrationButton =
        document.getElementById(
        "startCalibrationButton"
        );

        const cameraStatus =
        document.getElementById(
        "cameraStatus"
        );


        const calibrationMouth =
        document.getElementById(
        "calibrationMouth"
        );

        const calibrationInstruction =
        document.getElementById(
        "calibrationInstruction"
        );

        const calibrationStatus =
        document.getElementById(
        "calibrationStatus"
        );

        const calibrationProgressText =
        document.getElementById(
        "calibrationProgressText"
        );

        const calibrationProgressBar =
        document.getElementById(
        "calibrationProgressBar"
        );


        const startExperimentButton =
        document.getElementById(
        "startExperimentButton"
        );


        const countdownText =
        document.getElementById(
        "countdownText"
        );


        const setDisplay =
        document.getElementById(
        "setDisplay"
        );

        const mouthDisplay =
        document.getElementById(
        "mouthDisplay"
        );


        const sendDataButton =
        document.getElementById(
        "sendDataButton"
        );

        const backupButton =
        document.getElementById(
        "backupButton"
        );

        const sendStatus =
        document.getElementById(
        "sendStatus"
        );


        const webcam =
        document.getElementById(
        "webcam"
        );

        const cameraContainer =
        document.getElementById(
        "cameraContainer"
        );


        /* ===========================================================
        MediaPipe状態
        =========================================================== */

        let faceLandmarker =
        null;

        let cameraStream =
        null;

        let mediaPipeRunning =
        false;


        /* 同一Videoフレームの重複推論防止 */

        let lastVideoTime =
        -1;


        /* -----------------------------------------------------------
        InferenceId

        新しいVideoフレームについて
        MediaPipe推論を行うたびに+1。

        MouthLogの0.1秒記録とは独立。
        ----------------------------------------------------------- */

        let inferenceCounter =
        0;


        /* -----------------------------------------------------------
        最新MediaPipe結果
        ----------------------------------------------------------- */

        let latestMouthData = {

        faceDetected:
        false,

        jaw:
        0,

        smile:
        0,

        pucker:
        0,

        timestamp:
        0,

        inferenceId:
        0
        };


        /* ===========================================================
        Session
        =========================================================== */

        let sessionId =
        "";


        /* ===========================================================
        Calibration
        =========================================================== */

        let calibrationResult = {

        A: {
        jaw: 0,
        smile: 0,
        pucker: 0
        },

        I: {
        jaw: 0,
        smile: 0,
        pucker: 0
        },

        U: {
        jaw: 0,
        smile: 0,
        pucker: 0
        },

        BE: {
        jaw: 0,
        smile: 0,
        pucker: 0
        }
        };


        /* ===========================================================
        認識状態
        =========================================================== */

        let beStartTime =
        null;

        let lastRecognized =
        "N";


        /* ===========================================================
        実験状態
        =========================================================== */

        let experimentRunning =
        false;

        let experimentStartTime =
        0;

        let experimentAnimationFrame =
        null;

        let logTimer =
        null;


        /* 現在提示している口形 */

        let currentTargetMouth =
        "A";


        /* ===========================================================
        Log
        =========================================================== */

        let mouthLogs =
        [];


        /* ===========================================================
        送信状態
        =========================================================== */

        let dataSent =
        false;


        /* ===========================================================
        初期化
        =========================================================== */

        initializePage();


        function initializePage() {

        console.log(
        "JavaScript initialized."
        );


        /* カメラ映像表示 */

        if (
        !SHOW_CAMERA_PREVIEW
        ) {

        cameraContainer.style.display =
        "none";
        }


        /* -------------------------------------------------------
        イベント登録
        ------------------------------------------------------- */

        prepareCameraButton.addEventListener(
        "click",
        prepareCamera
        );


        startCalibrationButton.addEventListener(
        "click",
        startCalibration
        );


        startExperimentButton.addEventListener(
        "click",
        startCountdown
        );


        sendDataButton.addEventListener(
        "click",
        sendData
        );


        backupButton.addEventListener(
        "click",
        downloadBackup
        );


        cameraStatus.textContent =
        "準備ボタンを押してください。";
        }


        /* ===========================================================
        画面切替
        =========================================================== */

        function showScreen(
        targetScreen
        ) {

        const screens = [

        setupScreen,

        calibrationScreen,

        readyScreen,

        countdownScreen,

        experimentScreen,

        finishScreen
        ];


        for (
        const screen of screens
        ) {

        screen.classList.add(
        "hidden"
        );
        }


        targetScreen.classList.remove(
        "hidden"
        );
        }


        /* ===========================================================
        カメラ準備
        =========================================================== */

        async function prepareCamera() {

        console.log(
        "prepareCamera() called"
        );


        /* -------------------------------------------------------
        Session ID
        ------------------------------------------------------- */

        sessionId =
        sessionIdInput.value.trim();


        if (
        !sessionId
        ) {

        alert(
        "Session IDを入力してください。"
        );

        return;
        }


        prepareCameraButton.disabled =
        true;

        sessionIdInput.disabled =
        true;


        /* -------------------------------------------------------
        mediaDevices確認
        ------------------------------------------------------- */

        if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
        ) {

        cameraStatus.textContent =
        "カメラAPIを利用できません。HTTPSまたはlocalhostで開いてください。";


        prepareCameraButton.disabled =
        false;

        sessionIdInput.disabled =
        false;


        return;
        }


        try {

        /* ===================================================
        STEP 1
        カメラ
        =================================================== */

        cameraStatus.textContent =
        "1/4 カメラへのアクセスを確認しています...";


        cameraStream =
        await navigator.mediaDevices.getUserMedia({

        video: {

        facingMode:
        "user",

        width: {
        ideal: 640
        },

        height: {
        ideal: 480
        }
        },

        audio:
        false
        });


        console.log(
        "Camera permission OK"
        );


        /* ===================================================
        STEP 2
        Video
        =================================================== */

        cameraStatus.textContent =
        "2/4 カメラ映像を開始しています...";


        webcam.srcObject =
        cameraStream;


        await webcam.play();


        console.log(
        "Video started"
        );


        /* ===================================================
        STEP 3
        MediaPipe
        =================================================== */

        cameraStatus.textContent =
        "3/4 MediaPipeを読み込んでいます...";


        await initializeMediaPipe();


        console.log(
        "MediaPipe initialized"
        );


        /* ===================================================
        STEP 4
        推論開始
        =================================================== */

        mediaPipeRunning =
        true;


        requestAnimationFrame(
        mediaPipeLoop
        );


        cameraStatus.textContent =
        "4/4 顔をカメラに映してください...";


        const detected =
        await waitForFaceDetection(
        10000
        );


        if (
        !detected
        ) {

        throw new Error(
        "10秒以内に顔を検出できませんでした。"
        );
        }


        /* ===================================================
        完了
        =================================================== */

        cameraStatus.textContent =
        "準備完了";


        startCalibrationButton.disabled =
        false;


        console.log(
        "Face detected. Ready."
        );

        }
        catch (
        error
        ) {

        console.error(
        "prepareCamera error:",
        error
        );


        cameraStatus.textContent =
        "準備に失敗しました。\n" +
        error.message;


        prepareCameraButton.disabled =
        false;

        sessionIdInput.disabled =
        false;


        alert(
        "カメラまたはMediaPipeの準備に失敗しました。\n\n" +
        error.message
        );
        }
        }


        /* ===========================================================
        MediaPipe初期化
        =========================================================== */

        async function initializeMediaPipe() {

        console.log(
        "Loading MediaPipe WASM..."
        );


        /* -------------------------------------------------------
        WASM

        ここは +esm ではない。
        WASMファイルのディレクトリを指定する。
        ------------------------------------------------------- */

        const vision =
        await FilesetResolver.forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );


        console.log(
        "MediaPipe WASM loaded."
        );


        /* -------------------------------------------------------
        Face Landmarker
        ------------------------------------------------------- */

        faceLandmarker =
        await FaceLandmarker.createFromOptions(

        vision,

        {

        baseOptions: {

        modelAssetPath:

        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

        delegate:
        "GPU"
        },


        runningMode:
        "VIDEO",


        numFaces:
        1,


        outputFaceBlendshapes:
        true,


        outputFacialTransformationMatrixes:
        false
        }
        );


        console.log(
        "FaceLandmarker created."
        );
        }


        /* ===========================================================
        MediaPipe Loop
        =========================================================== */

        function mediaPipeLoop() {

        if (
        !mediaPipeRunning
        ) {

        return;
        }


        if (
        webcam.readyState >= 2 &&
        webcam.currentTime !== lastVideoTime
        ) {

        lastVideoTime =
        webcam.currentTime;


        const timestamp =
        performance.now();


        try {

        const result =
        faceLandmarker.detectForVideo(
        webcam,
        timestamp
        );


        processMediaPipeResult(
        result,
        timestamp
        );

        }
        catch (
        error
        ) {

        console.error(
        "MediaPipe inference error:",
        error
        );
        }
        }


        requestAnimationFrame(
        mediaPipeLoop
        );
        }


        /* ===========================================================
        MediaPipe結果
        =========================================================== */

        function processMediaPipeResult(
        result,
        timestamp
        ) {

        /* -------------------------------------------------------
        新しい推論結果番号
        ------------------------------------------------------- */

        inferenceCounter++;


        /* -------------------------------------------------------
        顔なし
        ------------------------------------------------------- */

        if (
        !result ||
        !result.faceBlendshapes ||
        result.faceBlendshapes.length === 0
        ) {

        latestMouthData = {

        faceDetected:
        false,

        jaw:
        0,

        smile:
        0,

        pucker:
        0,

        timestamp:
        timestamp,

        inferenceId:
        inferenceCounter
        };


        return;
        }


        /* -------------------------------------------------------
        BlendShape
        ------------------------------------------------------- */

        const categories =
        result.faceBlendshapes[0].categories;


        const jaw =
        getBlendshapeScore(
        categories,
        "jawOpen"
        );


        const smileLeft =
        getBlendshapeScore(
        categories,
        "mouthSmileLeft"
        );


        const smileRight =
        getBlendshapeScore(
        categories,
        "mouthSmileRight"
        );


        const smile =
        Math.max(
        smileLeft,
        smileRight
        );


        const pucker =
        getBlendshapeScore(
        categories,
        "mouthPucker"
        );


        latestMouthData = {

        faceDetected:
        true,

        jaw:
        jaw,

        smile:
        smile,

        pucker:
        pucker,

        timestamp:
        timestamp,

        inferenceId:
        inferenceCounter
        };
        }


        /* ===========================================================
        BlendShape取得
        =========================================================== */

        function getBlendshapeScore(
        categories,
        name
        ) {

        const item =
        categories.find(

        category =>
        category.categoryName ===
        name
        );


        if (
        !item
        ) {

        return 0;
        }


        return item.score;
        }


        /* ===========================================================
        顔検出待機
        =========================================================== */

        async function waitForFaceDetection(
        timeoutMs
        ) {

        const start =
        performance.now();


        while (
        performance.now() -
        start <
        timeoutMs
        ) {

        if (
        latestMouthData.faceDetected
        ) {

        return true;
        }


        await sleep(
        100
        );
        }


        return false;
        }


        /* ===========================================================
        キャリブレーション
        =========================================================== */

        async function startCalibration() {

        startCalibrationButton.disabled =
        true;


        showScreen(
        calibrationScreen
        );


        try {

        calibrationResult.A =
        await calibrateOneMouth(
        "A",
        1
        );


        calibrationResult.I =
        await calibrateOneMouth(
        "I",
        2
        );


        calibrationResult.U =
        await calibrateOneMouth(
        "U",
        3
        );


        calibrationResult.BE =
        await calibrateOneMouth(
        "BE",
        4
        );


        console.log(
        "===== Calibration Result ====="
        );


        console.table(
        calibrationResult
        );


        calibrationMouth.textContent =
        "OK!";


        calibrationInstruction.textContent =
        "準備完了";


        calibrationStatus.textContent =
        "実験を開始できます";


        calibrationProgressBar.style.width =
        "100%";


        await sleep(
        800
        );


        showScreen(
        readyScreen
        );

        }
        catch (
        error
        ) {

        console.error(
        error
        );


        alert(
        "キャリブレーション中にエラーが発生しました。\n\n" +
        error.message

        showScreen(

        );


        startCalibrationButton.disabled =

        }

        /* ===========================================================
        1口形キャリブレーション
        =========================================================== */

        async function calibrateOneMouth(
        mouthType,
        number
        ) {

        calibrationMouth.textContent =
        MOUTH_DISPLAY[
        mouthType
        ];


        calibrationInstruction.textContent =
        CALIBRATION_INSTRUCTIONS[
        mouthType
        ];


        calibrationProgressText.textContent =
        `${number} / 4`;


        calibrationStatus.textContent =
        "準備...";


        calibrationProgressBar.style.width =
        "0%";


        /* 準備0.5秒 */

        await sleep(
        CALIBRATION_PREPARE_TIME_MS
        );


        calibrationStatus.textContent =
        "そのままキープ！";


        const jawSamples =
        [];

        const smileSamples =
        [];

        const puckerSamples =
        [];


        const measurementStart =
        performance.now();


        /* -------------------------------------------------------
        測定1.5秒
        ------------------------------------------------------- */

        while (
        performance.now() -
        measurementStart <
        CALIBRATION_MEASUREMENT_TIME_MS
        ) {

        if (
        latestMouthData.faceDetected
        ) {

        jawSamples.push(
        latestMouthData.jaw
        );


        smileSamples.push(
        latestMouthData.smile
        );


        puckerSamples.push(
        latestMouthData.pucker
        );
        }


        const elapsed =
        performance.now() -
        measurementStart;


        const progress =
        Math.min(
        elapsed /
        CALIBRATION_MEASUREMENT_TIME_MS,
        1
        );


        calibrationProgressBar.style.width =
        `${progress * 100}%`;


        await sleep(
        16
        );
        }


        if (
        jawSamples.length === 0
        ) {

        throw new Error(
        `${MOUTH_DISPLAY[mouthType]} の測定中に顔情報を取得できませんでした。`
        );
        }


        const result = {

        jaw:
        calculateMedian(
        jawSamples
        ),

        smile:
        calculateMedian(
        smileSamples
        ),

        pucker:
        calculateMedian(
        puckerSamples
        )
        };


        console.log(
        `[Calibration ${mouthType}]`,
        result,
        `Samples=${jawSamples.length}`
        );


        return result;
        }


        /* ===========================================================
        中央値
        =========================================================== */

        function calculateMedian(
        values
        ) {

        if (
        !values ||
        values.length === 0
        ) {

        return 0;
        }


        const sorted =
        [...values].sort(
        (a, b) =>
        a - b
        );


        const middle =
        Math.floor(
        sorted.length / 2
        );


        if (
        sorted.length % 2 === 0
        ) {

        return (
        sorted[middle - 1] +
        sorted[middle]
        ) / 2;
        }


        return sorted[
        middle
        ];
        }


        /* ===========================================================
        カウントダウン
        =========================================================== */

        async function startCountdown() {

        startExperimentButton.disabled =
        true;


        showScreen(
        countdownScreen
        );


        countdownText.textContent =
        "3";

        await sleep(
        1000
        );


        countdownText.textContent =
        "2";

        await sleep(
        1000
        );


        countdownText.textContent =
        "1";

        await sleep(
        1000
        );


        countdownText.textContent =
        "開始";

        await sleep(
        500
        );


        startExperiment();
        }


        /* ===========================================================
        実験開始
        =========================================================== */

        function startExperiment() {

        mouthLogs =
        [];


        dataSent =
        false;


        beStartTime =
        null;


        lastRecognized =
        "N";


        currentTargetMouth =
        "A";


        experimentRunning =
        true;


        experimentStartTime =
        performance.now();


        showScreen(
        experimentScreen
        );


        setDisplay.textContent =
        `1 / ${TOTAL_SETS}`;


        mouthDisplay.textContent =
        MOUTH_DISPLAY.A;


        logTimer =
        setInterval(
        recordMouthLog,
        LOG_INTERVAL_MS
        );


        updateExperiment();
        }


        /* ===========================================================
        実験更新
        =========================================================== */

        function updateExperiment() {

        if (
        !experimentRunning
        ) {

        return;
        }


        const now =
        performance.now();


        const elapsed =
        now -
        experimentStartTime;


        const totalDuration =
        TOTAL_TRIALS *
        MOUTH_DURATION_MS;


        /* 終了 */

        if (
        elapsed >=
        totalDuration
        ) {

        finishExperiment();

        return;
        }


        /* 0～39 */

        const trialIndex =
        Math.floor(
        elapsed /
        MOUTH_DURATION_MS
        );


        /* 0～9 */

        const setIndex =
        Math.floor(
        trialIndex /
        MOUTHS_PER_SET
        );


        /* 0～3 */

        const mouthIndex =
        trialIndex %
        MOUTHS_PER_SET;


        const targetMouth =
        MOUTH_SEQUENCE[
        mouthIndex
        ];


        /* -------------------------------------------------------
        TargetMouth
        ------------------------------------------------------- */

        currentTargetMouth =
        targetMouth;


        /* UI */

        setDisplay.textContent =
        `${setIndex + 1} / ${TOTAL_SETS}`;


        mouthDisplay.textContent =
        MOUTH_DISPLAY[
        targetMouth
        ];


        experimentAnimationFrame =
        requestAnimationFrame(
        updateExperiment
        );
        }


        /* ===========================================================
        口形認識
        =========================================================== */

        function recognizeCurrentMouth(
        jaw,
        smile,
        pucker,
        now
        ) {

        /* -------------------------------------------------------
        4基準点とのユークリッド距離
        ------------------------------------------------------- */

        const distA =
        calculateDistance(
        jaw,
        smile,
        pucker,
        calibrationResult.A
        );


        const distI =
        calculateDistance(
        jaw,
        smile,
        pucker,
        calibrationResult.I
        );


        const distU =
        calculateDistance(
        jaw,
        smile,
        pucker,
        calibrationResult.U
        );


        const distBE =
        calculateDistance(
        jaw,
        smile,
        pucker,
        calibrationResult.BE
        );


        /* -------------------------------------------------------
        Neutral
        ------------------------------------------------------- */

        const maxValue =
        Math.max(
        jaw,
        smile,
        pucker
        );


        if (
        maxValue <
        MOUTH_DEAD_ZONE
        ) {

        beStartTime =
        null;


        lastRecognized =
        "N";


        return {

        recognized:
        "N",

        distA:
        distA,

        distI:
        distI,

        distU:
        distU,

        distBE:
        distBE
        };
        }


        /* -------------------------------------------------------
        最小距離

        Unityと同じくAから比較
        ------------------------------------------------------- */

        let recognized =
        "A";


        let minDistance =
        distA;


        if (
        distI <
        minDistance
        ) {

        minDistance =
        distI;

        recognized =
        "I";
        }


        if (
        distU <
        minDistance
        ) {

        minDistance =
        distU;

        recognized =
        "U";
        }


        if (
        distBE <
        minDistance
        ) {

        minDistance =
        distBE;

        recognized =
        "BE";
        }


        /* -------------------------------------------------------
        BEだけ0.15秒保持
        ------------------------------------------------------- */

        if (
        recognized ===
        "BE"
        ) {

        if (
        beStartTime ===
        null
        ) {

        beStartTime =
        now;
        }


        if (
        now -
        beStartTime >=
        BE_HOLD_TIME_MS
        ) {

        lastRecognized =
        "BE";
        }


        return {

        recognized:
        lastRecognized,

        distA:
        distA,

        distI:
        distI,

        distU:
        distU,

        distBE:
        distBE
        };
        }


        /* BE候補解除 */

        beStartTime =
        null;


        /* A / I / Uは即時 */

        lastRecognized =
        recognized;


        return {

        recognized:
        recognized,

        distA:
        distA,

        distI:
        distI,

        distU:
        distU,

        distBE:
        distBE
        };
        }


        /* ===========================================================
        ユークリッド距離
        =========================================================== */

        function calculateDistance(
        jaw,
        smile,
        pucker,
        target
        ) {

        const jawDiff =
        jaw -
        target.jaw;


        const smileDiff =
        smile -
        target.smile;


        const puckerDiff =
        pucker -
        target.pucker;


        return Math.sqrt(

        jawDiff * jawDiff +

        smileDiff * smileDiff +

        puckerDiff * puckerDiff
        );
        }


        /* ===========================================================
        MouthLog

        約0.1秒ごと
        =========================================================== */

        function recordMouthLog() {

        if (
        !experimentRunning
        ) {

        return;
        }


        /* -------------------------------------------------------
        顔未検出時は記録しない

        0をNeutral実測値として扱うことを防止
        ------------------------------------------------------- */

        if (
        !latestMouthData.faceDetected
        ) {

        return;
        }


        const now =
        performance.now();


        const elapsedSeconds =
        (
        now -
        experimentStartTime
        ) / 1000;


        const jaw =
        latestMouthData.jaw;


        const smile =
        latestMouthData.smile;


        const pucker =
        latestMouthData.pucker;


        const recognition =
        recognizeCurrentMouth(
        jaw,
        smile,
        pucker,
        now
        );


        mouthLogs.push({

        SessionID:
        sessionId,


        Time:
        elapsedSeconds,


        /* 現在提示している口形 */

        TargetMouth:
        currentTargetMouth,


        Jaw:
        jaw,


        Smile:
        smile,


        Pucker:
        pucker,


        DistA:
        recognition.distA,


        DistI:
        recognition.distI,


        DistU:
        recognition.distU,


        DistBE:
        recognition.distBE,


        /* 内部認識結果 */

        Recognized:
        recognition.recognized,


        /* MediaPipe推論番号 */

        InferenceId:
        latestMouthData.inferenceId,


        /* 非ゲーム条件なので未使用 */

        Lane:
        -1
        });
        }


        /* ===========================================================
        実験終了
        =========================================================== */

        function finishExperiment() {

        experimentRunning =
        false;


        if (
        logTimer !==
        null
        ) {

        clearInterval(
        logTimer
        );

        logTimer =
        null;
        }


        if (
        experimentAnimationFrame !==
        null
        ) {

        cancelAnimationFrame(
        experimentAnimationFrame
        );

        experimentAnimationFrame =
        null;
        }


        showScreen(
        finishScreen
        );


        sendStatus.textContent =
        "データはまだ送信されていません。";


        console.log(
        "Experiment Finished"
        );


        console.log(
        "MouthLog Rows:",
        mouthLogs.length
        );
        }


        /* ===========================================================
        GAS送信
        =========================================================== */

        async function sendData() {

        if (
        dataSent
        ) {

        return;
        }


        if (
        GAS_URL ===
        "ここにGASのWebアプリURL"
        ) {

        alert(
        "index.html 内の GAS_URL を設定してください。"
        );

        return;
        }


        sendDataButton.disabled =
        true;


        sendStatus.textContent =
        "送信中...";


        /* -------------------------------------------------------
        CalibrationResult
        ------------------------------------------------------- */

        const calibrationPayload = {

        SessionID:
        sessionId,


        DateTime:
        new Date().toISOString(),


        A_Jaw:
        calibrationResult.A.jaw,

        A_Smile:
        calibrationResult.A.smile,

        A_Pucker:
        calibrationResult.A.pucker,


        I_Jaw:
        calibrationResult.I.jaw,

        I_Smile:
        calibrationResult.I.smile,

        I_Pucker:
        calibrationResult.I.pucker,


        U_Jaw:
        calibrationResult.U.jaw,

        U_Smile:
        calibrationResult.U.smile,

        U_Pucker:
        calibrationResult.U.pucker,


        BE_Jaw:
        calibrationResult.BE.jaw,

        BE_Smile:
        calibrationResult.BE.smile,

        BE_Pucker:
        calibrationResult.BE.pucker
        };


        const payload = {

        calibration:
        calibrationPayload,

        mouthLogs:
        mouthLogs
        };


        try {

        const body =
        new URLSearchParams();


        body.append(
        "payload",
        JSON.stringify(
        payload
        )
        );


        const response =
        await fetch(

        GAS_URL,

        {
        method:
        "POST",

        body:
        body
        }
        );


        const result =
        await response.json();


        if (
        !result.success
        ) {

        throw new Error(
        result.message ||
        "GAS側でエラーが発生しました。"
        );
        }


        dataSent =
        true;


        sendStatus.textContent =
        "送信成功：" +
        "CalibrationResult 1行 / " +
        `MouthLog ${result.mouthLogRows}行`;


        sendDataButton.disabled =
        true;


        console.log(
        "Send Success:",
        result
        );

        }
        catch (
        error
        ) {

        console.error(
        error
        );


        sendStatus.textContent =
        "送信失敗。データはブラウザ内に保持されています。";


        sendDataButton.disabled =
        false;


        alert(
        "データ送信に失敗しました。\n\n" +
        error.message
        );
        }
        }


        /* ===========================================================
        JSONバックアップ
        =========================================================== */

        function downloadBackup() {

        const calibrationPayload = {

        SessionID:
        sessionId,


        DateTime:
        new Date().toISOString(),


        A_Jaw:
        calibrationResult.A.jaw,

        A_Smile:
        calibrationResult.A.smile,

        A_Pucker:
        calibrationResult.A.pucker,


        I_Jaw:
        calibrationResult.I.jaw,

        I_Smile:
        calibrationResult.I.smile,

        I_Pucker:
        calibrationResult.I.pucker,


        U_Jaw:
        calibrationResult.U.jaw,

        U_Smile:
        calibrationResult.U.smile,

        U_Pucker:
        calibrationResult.U.pucker,


        BE_Jaw:
        calibrationResult.BE.jaw,

        BE_Smile:
        calibrationResult.BE.smile,

        BE_Pucker:
        calibrationResult.BE.pucker
        };


        const backup = {

        calibration:
        calibrationPayload,

        mouthLogs:
        mouthLogs
        };


        const json =
        JSON.stringify(
        backup,
        null,
        2
        );


        const blob =
        new Blob(

        [json],

        {
        type:
        "application/json"
        }
        );


        const url =
        URL.createObjectURL(
        blob
        );


        const anchor =
        document.createElement(
        "a"
        );


        anchor.href =
        url;


        anchor.download =
        `${sessionId}_NonGame_Backup.json`;


        document.body.appendChild(
        anchor
        );


        anchor.click();


        anchor.remove();


        URL.revokeObjectURL(
        url
        );
        }


        /* ===========================================================
        Sleep
        =========================================================== */

        function sleep(
        ms
        ) {

        return new Promise(

        resolve =>
        setTimeout(
        resolve,
        ms
        )
        );
        }


        /* ===========================================================
        ページ終了
        =========================================================== */

        window.addEventListener(

        "beforeunload",

        () => {

        mediaPipeRunning =
        false;


        if (
        cameraStream
        ) {

        const tracks =
        cameraStream.getTracks();


        for (
        const track of tracks
        ) {

        track.stop();
        }
        }


        if (
        faceLandmarker
        ) {

        try {

        faceLandmarker.close();

        }
        catch (
        error
        ) {

        console.warn(
        error
        );
        }
        }
        }
        );

    </script>
